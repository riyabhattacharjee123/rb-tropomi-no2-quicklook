name: ci

on:
  push:
  pull_request:
  workflow_dispatch:   # lets you click "Run workflow" manually

jobs:
  # 1) Run tests and do a local Docker build (no push)
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      # Pull repo
      - name: Checkout
        uses: actions/checkout@v4

      # Install Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install pinned requirements
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Create tests/data/synthetic.nc (tiny, for fast tests)
      - name: Generate synthetic dataset
        run: python tools/regen_synth.py

      # Run pytest
      - name: Run tests
        run: PYTHONPATH=. pytest -q

      # Try building the Docker image (sanity check only)
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: tropomi-no2:ci

  # 2) If tests passed, build & push an image to GHCR
  publish-image:
    name: Build & Push image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-build                # ← waits for tests to pass
    permissions:
      contents: read
      packages: write                    # ← required to push to GHCR with GITHUB_TOKEN
    env:
      # Final image name in GHCR (owner is your GitHub username/org)
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tropomi-no2-quicklook
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Optional: enable multi-arch emulation (you can leave it; safe)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Set up Docker Buildx (modern builder with caching)
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Log in to GHCR using built-in token (works if repo has "Read and write" workflow permissions)
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build and push the image
      - name: Build & Push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Two tags: "latest" (human-friendly) and the commit SHA (traceable)
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Speed up future builds with GitHub Actions cache (optional but recommended)
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # If you need multi-arch later, uncomment:
          # platforms: linux/amd64,linux/arm64
