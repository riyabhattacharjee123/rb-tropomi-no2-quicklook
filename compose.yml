services:
  app:
    image: ghcr.io/riyabhattacharjee123/tropomi-no2-quicklook:latest
    container_name: tropomi-no2-app
    environment:
      - APP_VERSION=${APP_VERSION:-dev}
      - MAX_UPLOAD=20971520
    ports:
      - "8000:8000"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: tropomi-no2-prom
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-oss:latest
    container_name: tropomi-no2-graf
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
